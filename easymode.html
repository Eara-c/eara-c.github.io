
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Easy mode</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="easymode.css">

</head>

<body>

    <a id="retour" href="#">← Retour à la fiche</a>

    <h1>Easy mode</h1>

    <div id="question">Chargement...</div>

    <div id="options"></div>

    <button id="next" onclick="nouvelleQuestion()">Next</button>

    <script>

        let donnees = [];

        let bonneReponse = "";

        // Récupération du numéro de ligne
        const parametres = new URLSearchParams(window.location.search);
        const numeroLigne = Number(parametres.get("ligne"));

        // Chargement du fichier Excel
        async function chargerQuiz() {

            try {

                if (!Number.isInteger(numeroLigne) || numeroLigne < 1) {
                    throw new Error("Numéro de ligne invalide.");
                }

                document.getElementById("retour").href =
                    "fiche.html?ligne=" + numeroLigne;

                const response = await fetch("./bdd.xlsx");

                if (!response.ok) {
                    throw new Error("Impossible de trouver bdd.xlsx.");
                }

                const data = await response.arrayBuffer();

                const workbook = XLSX.read(data, { type: "array" });

                // Récupération de la feuille voclists
                const feuilleVoclists = workbook.Sheets["voclists"];

                if (!feuilleVoclists) {
                    throw new Error("Feuille voclists introuvable.");
                }

                // Récupération du nom de la liste
                const celluleNom = feuilleVoclists["A" + numeroLigne];

                if (!celluleNom || !celluleNom.v) {
                    throw new Error("Nom de liste introuvable.");
                }

                const nomListe = String(celluleNom.v).trim();

                // Recherche de la feuille correspondante
                const nomFeuille = workbook.SheetNames.find(
                    nom => nom.trim().toLowerCase() === nomListe.toLowerCase()
                );

                if (!nomFeuille) {
                    throw new Error("Feuille " + nomListe + " introuvable.");
                }

                const feuille = workbook.Sheets[nomFeuille];

                // Récupération des colonnes A, B et C
                const lignes = XLSX.utils.sheet_to_json(
                    feuille,
                    {
                        header: 1,
                        defval: ""
                    }
                );

                // Préparation des données du quiz
                donnees = lignes
                    .map(ligne => ({
                        A: String(ligne[0] ?? "").trim(),
                        B: String(ligne[1] ?? "").trim(),
                        C: String(ligne[2] ?? "").trim()
                    }))
                    .filter(ligne => ligne.A !== "" && ligne.B !== "");

                if (donnees.length < 3) {
                    throw new Error(
                        "Il faut au moins 3 lignes complètes dans la liste pour créer un quiz."
                    );
                }

                // Lancement de la première question
                nouvelleQuestion();

            } catch (erreur) {

                document.getElementById("question").textContent =
                    "Erreur : " + erreur.message;

                console.error(erreur);

            }
        }


        // Création d'une nouvelle question
        function nouvelleQuestion() {

            document.getElementById("next").style.display = "none";

            const optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";

            // Choisir une ligne au hasard
            const index = Math.floor(Math.random() * donnees.length);
            const ligne = donnees[index];

            // Choisir la colonne à interroger
            const colonneQuestion = Math.random() < 0.5 ? "A" : "B";

            const colonneReponse = colonneQuestion === "A" ? "B" : "A";

            // Récupérer le mot à afficher
            const mot = ligne[colonneQuestion];

            // Ajouter l'information de la colonne C si elle existe
            const indication = ligne.C !== "" ? " (" + ligne.C + ")" : "";

            document.getElementById("question").textContent =
                mot + indication;

            // Récupérer la bonne réponse
            bonneReponse = ligne[colonneReponse];

            // Récupérer deux mauvaises réponses
            const mauvaisesReponses = donnees
                .filter((element, i) =>
                    i !== index &&
                    element[colonneReponse] !== bonneReponse
                )
                .map(element => element[colonneReponse]);

            // Éviter les doublons
            const reponsesUniques = [...new Set(mauvaisesReponses)];

            // Mélanger les mauvaises réponses
            reponsesUniques.sort(() => Math.random() - 0.5);

            // Construire les trois réponses
            const choix = [
                bonneReponse,
                ...reponsesUniques.slice(0, 2)
            ];

            // Mélanger les trois propositions
            choix.sort(() => Math.random() - 0.5);

            // Créer les boutons
            choix.forEach(reponse => {

                const bouton = document.createElement("button");

                bouton.textContent = reponse;
                bouton.className = "reponse";

                bouton.onclick = () => verifierReponse(bouton);

                optionsDiv.appendChild(bouton);

            });

        }


        // Vérification de la réponse
        function verifierReponse(boutonClique) {

            const boutons = document.querySelectorAll(".reponse");

            boutons.forEach(bouton => {

                // Désactiver tous les boutons
                  bouton.disabled = true;

				// Mettre la bonne réponse en vert
				if (bouton.textContent === bonneReponse) {
					bouton.classList.add("correct");
				}

				// Mettre les mauvaises réponses en rouge
				else {
					bouton.classList.add("incorrect");
				}

			});

			// Mettre en évidence la réponse choisie
			boutonClique.classList.add("choisie");

			// Afficher le bouton Next
			document.getElementById("next").style.display = "inline-block";

		}


        // Lancement du quiz
        chargerQuiz();

    </script>

</body>
</html>
