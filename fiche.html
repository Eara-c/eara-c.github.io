
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma fiche</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        button {
            display: block;
            margin: 10px;
            padding: 12px 25px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <a href="index.html">← Retour à la liste</a>

    <h1 id="titre">Chargement...</h1>

    <h2>Choisis ton mode :</h2>

    <button onclick="allerVers('seelist.html')">
        See list
    </button>

    <button onclick="allerVers('easymode.html')">
        Easy mode
    </button>

    <button onclick="allerVers('normalmode.html')">
        Normal mode
    </button>

    <script>

        // Récupération du numéro de ligne
        const parametres = new URLSearchParams(window.location.search);
        const numeroLigne = parametres.get("ligne");

        // Fonction pour conserver le numéro de ligne
        function allerVers(page) {
            window.location.href = page + "?ligne=" + numeroLigne;
        }

        // Chargement de la fiche Excel
        async function chargerFiche() {

            const titre = document.getElementById("titre");

            try {

                if (typeof XLSX === "undefined") {
                    throw new Error("Bibliothèque Excel non chargée.");
                }

                const response = await fetch("./bdd.xls");

                if (!response.ok) {
                    throw new Error("Impossible de trouver bdd.xls.");
                }

                const data = await response.arrayBuffer();
                const workbook = XLSX.read(data, { type: "array" });
                const feuille = workbook.Sheets[workbook.SheetNames[0]];

                const adresse = "A" + numeroLigne;
                const cellule = feuille[adresse];

                if (!cellule || cellule.v === undefined) {
                    throw new Error("Cellule introuvable.");
                }

                titre.textContent = cellule.v;

            } catch (erreur) {
                titre.textContent = "Erreur : " + erreur.message;
                console.error(erreur);
            }
        }

        chargerFiche();

    </script>

</body>
</html>
