<!DOCTYPE html>
<html>
 
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="mystyle.css">
	 <title>Mon site</title>

    <!-- Bibliothèque permettant de lire Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
	
</head>
 
<body>


    <body>

    <h1>Ma liste</h1>
    <div id="liste-boutons">Chargement...</div>

    <script>
        async function chargerExcel() {
            try {
                const response = await fetch("bdd.xlsx");

                if (!response.ok) {
                    throw new Error("Impossible de charger bdd.xls");
                }

                const data = await response.arrayBuffer();
                const workbook = XLSX.read(data);
                const feuille = workbook.Sheets[workbook.SheetNames[0]];

                const lignes = XLSX.utils.sheet_to_json(
                    feuille,
                    { header: 1, defval: "" }
                );

                const conteneur = document.getElementById("liste-boutons");
                conteneur.innerHTML = "";

                lignes.forEach((ligne, index) => {
                    const valeur = ligne[0];

                    if (String(valeur).trim() !== "") {
                        const bouton = document.createElement("button");

                        bouton.textContent = valeur;

                        bouton.onclick = () => {
                            window.location.href =
                                "fiche.html?ligne=" + (index + 1);
                        };

                        conteneur.appendChild(bouton);
                    }
                });

            } catch (erreur) {
                document.getElementById("liste-boutons").textContent =
                    "Erreur : " + erreur.message;
            }
        }

        chargerExcel();
    </script>

</body>

</body>
 
</html>
